version: 2.1

# There's an orb for ccache, but it only works on Linux runners and requires
# sudo to be installed on the host for some reason. I opted to do it myself
# instead.
#orbs:
#  ccache: dynomite567/ccache@1.0.1

jobs:
  ubuntu-24-04:
    environment:
      ZEEK_CI_CONFIGURE_FLAGS: --build-type=release --disable-broker-tests --prefix=$CIRRUS_WORKING_DIR/install --ccache --enable-werror
      ZEEK_CI_CPUS: 4
      ZEEK_CI_BTEST_JOBS: 4
      ZEEK_CI_RUNNER_OS: linux
      ZEEK_TEST_ULIMIT_OPEN_FILES: 256
    docker:
      - image: ubuntu:24.04
    steps:
      - run:
          name: Install Dependencies
          command: |
            apt-get update && apt-get -y install \
                bc \
                bison \
                bsdmainutils \
                ccache \
                clang-19 \
                clang++-19 \
                clang-tidy-19 \
                cmake \
                cppzmq-dev \
                curl \
                dnsmasq \
                flex \
                g++ \
                gcc \
                git \
                jq \
                lcov \
                libhiredis-dev \
                libkrb5-dev \
                libmaxminddb-dev \
                libnode-dev \
                libpcap-dev \
                libssl-dev \
                make \
                python3 \
                python3-dev \
                python3-git \
                python3-pip \
                python3-semantic-version \
                redis-server \
                ruby \
                sqlite3 \
                swig \
                unzip \
                wget \
                zlib1g-dev \
                libc++-dev \
                libc++abi-dev
            pip3 install --break-system-packages websockets junit2html
            gem install coveralls-lcov
            update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-19 1000
          environment:
            DEBIAN_FRONTEND: noninteractive
            TZ: America/Los_Angeles
      - checkout
      - run:
          name: Update submodules
          command: git submodule update --recursive --init
      - run:
          name: Build
          command: ci/build.sh
          environment:
      - run:
          name: Test
          command: ci/test.sh

workflows:
  build-and-test:
    jobs:
      - ubuntu-24-04
