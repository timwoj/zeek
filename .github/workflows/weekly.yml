##################################################################################
# Weekly builds with bleeding-edge compilers from Debian Unstable             #
##################################################################################

name: Weekly Builds

on:
  push:
    branches:
      - topic/timw/weekly-edge-compiler-build-workflow
  schedule:
    # Weekly builds on Sunday at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:  # Allow manual triggering

env:
  ZEEK_CI_CPUS: 4
  ZEEK_CI_BTEST_JOBS: 4
  ZEEK_CI_BTEST_RETRIES: 2
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_DIR: /tmp/ccache
  CCACHE_COMPRESS: 1
  CCACHE_MAXSIZE: 700M
  CCACHE_MAXFILES: 20000
  ZEEK_CCACHE_EPOCH: 2

jobs:
  # Build with bleeding-edge GCC and Clang from Debian Unstable
  weekly:
    if: github.repository == 'timwoj/zeek'
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang]

    runs-on: ubuntu-latest

    container:
      image: debian:unstable

    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
              bison \
              bsdmainutils \
              ccache \
              cmake \
              cppzmq-dev \
              curl \
              dnsmasq \
              flex \
              g++ \
              gcc \
              git \
              jq \
              libfl-dev \
              libkrb5-dev \
              libnats-dev \
              libnode-dev \
              libpcap-dev \
              librdkafka-dev \
              libssl-dev \
              libuv1-dev \
              make \
              python3 \
              python3-dev \
              python3-pip\
              sqlite3 \
              swig \
              wget \
              xz-utils \
              zlib1g-dev
          pip3 install --break-system-packages websockets junit2html

      - name: Install latest compiler version
        run: |
          apt-get update
          LATEST_VERSION=$(apt-cache search ${{ matrix.compiler }} |
              awk '/^'"${{ matrix.compiler }}"'-[0-9]{2}[^-]/ {print $1}' |
              sort | tail -1 | awk -F- '{print $2}')

          echo "Installing ${{ matrix.compiler }}-${LATEST_VERSION}"
          apt-get install -y ${{ matrix.compiler }}-${LATEST_VERSION}

          update-alternatives --install /usr/bin/cc cc "/usr/bin/${{ matrix.compiler }}-${LATEST_VERSION}" 100
          update-alternatives --set cc "/usr/bin/${{ matrix.compiler }}-${LATEST_VERSION}"

          if [ "${{ matrix.compiler }}" = "gcc" ]; then
              apt-get install -y g++-${LATEST_VERSION}
              update-alternatives --install /usr/bin/c++ c++ "/usr/bin/g++-${LATEST_VERSION}" 100
              update-alternatives --set c++ "/usr/bin/g++-${LATEST_VERSION}"
          else
              update-alternatives --install /usr/bin/c++ c++ "/usr/bin/clang++-${LATEST_VERSION}" 100
              update-alternatives --set c++ "/usr/bin/clang++-${LATEST_VERSION}"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ env.ZEEK_CCACHE_EPOCH }}-weekly-${{ matrix.compiler }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.ZEEK_CCACHE_EPOCH }}-weekly-${{ matrix.compiler }}-

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3

      # - name: Init external repos
      #   run: docker run --rm -v ${{ github.workspace }}:/zeek -w /zeek zeek-ci ./ci/init-external-repos.sh
      #   env:
      #     ZEEK_TESTING_PRIVATE_SSH_KEY: ${{ secrets.ZEEK_TESTING_PRIVATE_SSH_KEY }}

      - name: Pre-build
        run: ./ci/pre-build.sh

      - name: Build
        run: ./ci/build.sh

      - name: Test
        run: ./ci/test.sh

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Prune ccache
        if: always()
        run: ccache -c

      - name: Upload btest failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: btest-failures-weekly-${{ matrix.compiler }}
          path: testing/**/tmp.tar.gz

      - name: Upload btest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btest-results-weekly-${{ matrix.compiler }}
          path: |
            testing/**/btest-results.xml
            testing/**/btest-results.html
